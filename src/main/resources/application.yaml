spring:
  application:
    name: ecommerce-backend-spring
  datasource:
    url: jdbc:mysql://localhost:3306/ecommerce_backend_spring?createDatabaseIfNotExist=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    show-sql: true
  config:
    import: optional:file:.env[.properties]
  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 10MB
  jwt:
    secret: ${JWT_SECRET}
    accessTokenExpiration: 1800 #30mn
    refreshTokenExpiration: 604800 #7d
file:
  upload-dir: uploads